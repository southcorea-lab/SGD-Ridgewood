<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Order Guard">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Order Guard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#111827;--ink2:#374151;--mut:#6b7280;--line:#e5e7eb;--pri:#0f766e;--pri2:#0d5f59;--priBg:#e6f4f2;--ok:#15803d;--okBg:#e8f5ec;--warn:#b45309;--warnBg:#fef3c7;--bad:#b91c1c;--badBg:#fee2e2;--blue:#1d4ed8;--blueBg:#e0e7ff;--r:14px;--sh:0 1px 2px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.04)}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
body.cta{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:inherit}
/* app bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.92);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.bar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.bt{flex:1;min-width:0}
.bt b{display:block;font-size:16px;letter-spacing:-.01em}
.bt span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9ca3af;margin-right:5px;vertical-align:1px}
.dot.ok{background:#22c55e}.dot.err{background:#ef4444}
.langs{display:flex;background:#e5e7eb;border-radius:999px;padding:2px;flex:none}
.langs button{border:0;background:none;padding:4px 10px;font-size:12px;border-radius:999px;color:var(--mut);font-weight:600}
.langs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
main{padding:4px 16px 20px;max-width:680px;margin:0 auto}
/* type */
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px}
.cap{font-size:13px;color:var(--mut)}
.sec{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px}
.sub{color:var(--mut);font-size:12.5px}
/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:10px 0}
.card.flush{padding:0;overflow:hidden}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
/* summary */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum div{background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:10px 12px}
.sum b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sum span{font-size:11.5px;color:var(--mut)}
/* vendor list */
.vrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow:active{background:#f9fafb}
.av{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.vt{flex:1;min-width:0}
.vt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt span{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.chev{color:#c4c8cf;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none;background:#f3f4f6;color:var(--mut)}
.pill.draft{background:var(--warnBg);color:var(--warn)}
.pill.sent{background:var(--blueBg);color:var(--blue)}
.pill.ok{background:var(--okBg);color:var(--ok)}
.pill.bad{background:var(--badBg);color:var(--bad)}
/* buttons */
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn:active{background:var(--pri2)}
.btn.full{width:100%}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--pri);padding:8px 10px;border:0}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c2c2}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:#fff;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;flex:none}
/* screen header */
.sh{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.sh .tt{flex:1;min-width:0}
.sh .tt b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* search + segmented */
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:0 12px;height:42px}
.search input{border:0;outline:0;flex:1;font-size:16px;background:none;padding:0;min-width:0}
.seg{display:flex;background:#e5e7eb;border-radius:10px;padding:2px;margin:10px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
/* order grid */
.gi{display:grid;grid-template-columns:24px minmax(0,1fr) 64px 44px;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi.hdr{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;background:#fafafa}
.gi.on{background:#f2faf8}
.gi.off .n1{color:var(--ink2);font-weight:500}
.ckw{display:flex;align-items:center;justify-content:center;height:30px;margin:0}
.ck{width:14px;height:14px;accent-color:var(--pri);margin:0}
.n1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lq{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.qn{width:44px;height:28px;padding:0;text-align:center;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff;font-variant-numeric:tabular-nums}
.qn::-webkit-outer-spin-button,.qn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qn{-moz-appearance:textfield}
.qn:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
.gi.on .qn{border-color:#9fd3ca;font-weight:600}
/* banner */
.banner{display:flex;gap:10px;background:var(--warnBg);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13.5px;color:#78350f}
.banner a{color:#92400e;font-weight:600}
/* sticky CTA */
.cta{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));padding:10px 16px;background:linear-gradient(180deg,rgba(244,245,247,0),var(--bg) 30%);z-index:4}
.cta .in{max-width:680px;margin:0 auto}
.cta .btn{width:100%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 16px rgba(15,118,110,.25)}
/* review */
.rl{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14.5px}
.rl:last-child{border-bottom:0}
.rl span:last-child{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.msg{background:#e9f5ff;border-radius:16px 16px 4px 16px;padding:12px 14px;font-size:14px;white-space:pre-wrap;color:#0b2540;margin:4px 0 0 24px}
textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:150px;background:#fff;resize:vertical}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li:before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--priBg);color:var(--pri);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.steps li>div{flex:1}
/* settings list */
.fl{display:block;padding:10px 14px;border-bottom:1px solid var(--line)}
.fl:last-child{border-bottom:0}
.fl label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.fl input,.fl select{width:100%;border:0;outline:0;font:inherit;font-size:16px;background:none;padding:2px 0;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap;font-size:13.5px;flex:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 56px 30px;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.irow input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:16px;font-family:inherit;min-width:0}
.x{border:0;background:none;color:#9ca3af;font-size:20px;line-height:1;padding:0}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;font-family:inherit;background:#fff}
.lbl{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
select.inp{appearance:auto}
/* insights */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.kpi div{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.kpi b{font-size:26px;font-weight:700;display:block;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--mut)}
.kpi div.alert b{color:var(--bad)}
.bar2{height:6px;border-radius:3px;background:#fee2e2;margin-top:5px;overflow:hidden}
.bar2 i{display:block;height:100%;background:#ef4444;border-radius:3px}
.empty{color:var(--mut);font-size:13.5px;padding:18px 14px;text-align:center}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;font-weight:600;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button.on{color:var(--pri)}
nav .soon{position:absolute;top:2px;left:calc(50% + 4px);background:#e5e7eb;color:#6b7280;font-size:9px;border-radius:999px;padding:1px 5px;font-weight:700}
nav button{min-width:0}
nav .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;padding:0 4px;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(140px + env(safe-area-inset-bottom));background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center;z-index:20}
#toast.on{opacity:.96;transform:translateX(-50%)}
#upd{display:none;position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top));background:#111827;color:#fff;border-radius:14px;padding:10px 12px;z-index:30;font-size:14px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="bar"><div class="in"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></div><div class="bt"><b id="ttl"></b><span id="sync"></span></div><div class="langs" id="langs"></div></div></div>

<nav id="nav"></nav>
<div id="upd"><span id="updt"></span><button class="btn sm" onclick="location.reload()" id="updb"></button></div>
<div id="toast"></div>

/* 이전 버전 데이터에 영문 이름·언어 설정을 채워 넣는다 */
function migrate(x){
  const base=seed(),em={};
  base.vendors.forEach(v=>{em[v.id]=v.en;v.items.forEach(i=>em[i.id]=i.en)});
  x.vendors.forEach(v=>{if(!v.en&&em[v.id])v.en=em[v.id];if(!v.smsLang)v.smsLang="ko";v.items.forEach(i=>{if(!i.en&&em[i.id])i.en=em[i.id]})});
  x.vendors.forEach(v=>{if(!Array.isArray(v.days))v.days=[];if(!v.cutoff)v.cutoff="09:00"});if(x.lead==null)x.lead=30;if(!x.interest)x.interest={};if(!x.lang)x.lang="en";if(x.storeEn==null)x.storeEn="";if(!x.drafts)x.drafts={};if(!x.runs)x.runs=[];
  return x;
}

const fq=n=>(Math.round(n*100)/100).toString();
function freq(vid){const os=vOrders(vid).slice(0,4),m={};os.forEach(o=>o.lines.forEach(l=>{if(l.qty>0)m[l.itemId]=(m[l.itemId]||0)+1}));return{n:os.length,m}}

function buildSms(v,lines){
  const l=v.smsLang||"ko",tt=(k,vars)=>{let s=T[l][k];for(const x in vars)s=s.split("{"+x+"}").join(vars[x]);return s};
  const store=l==="en"?(S.storeEn||S.store):S.store;
  const rows=lines.map(x=>{const i=itemOf(v,x.itemId);return l==="en"?"- "+nameOf(i,"en")+": "+fq(x.qty)+" "+unitOf(i.unit,"en"):"- "+i.name+" "+fq(x.qty)+unitOf(i.unit,"ko")});

const cu=p=>CFG.SUPABASE_URL.replace(/\/$/,"")+p;
function saveSess(x){sess=x;try{x?localStorage.setItem(SK,JSON.stringify(x)):localStorage.removeItem(SK)}catch(e){}}
function takeSess(r){if(!r||!r.access_token)return false;saveSess({access_token:r.access_token,refresh_token:r.refresh_token||(sess&&sess.refresh_token),expires_at:Math.floor(Date.now()/1000)+(+r.expires_in||3600),user:r.user||(sess&&sess.user)||null});return true}
async function errText(r){try{const j=await r.json();return j.msg||j.error_description||j.message||j.error||("HTTP "+r.status)}catch(e){return"HTTP "+r.status}}
async function fresh(){
  if(!sess||sess.expires_at-Math.floor(Date.now()/1000)>60)return;
  const r=await fetch(cu("/auth/v1/token?grant_type=refresh_token"),{method:"POST",headers:{apikey:CFG.SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:sess.refresh_token})});
  if(r.ok){takeSess(await r.json());return}
  if(r.status===400||r.status===401){saveSess(null);cl.st="out"}
  throw new Error(await errText(r));

function cloudSoon(){if(cl.st!=="in")return;clearTimeout(cl.t);cl.t=setTimeout(cloudPush,3000)}
async function cloudPush(){
  if(cl.st!=="in")return;
  if(cl.busy){cl.again=true;return}
  cl.busy=true;cl.dirty=false;
  try{
    const r=await sb("/rest/v1/app_state?on_conflict=user_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:uidOf(),data:S,rev:S.rev||0,updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error(await errText(r));
    let snap="";try{snap=localStorage.getItem("orderguard.snap")||""}catch(e){}
    if(snap!==today()){await backupInsert(S);try{localStorage.setItem("orderguard.snap",today())}catch(e){}}
    cl.last=Date.now();cl.err="";
  }catch(e){cl.err=String(e&&e.message||e);cl.dirty=true;setTimeout(cloudSoon,20000)}
  cl.busy=false;
  if(cl.again){cl.again=false;cloudSoon()}
  render();
}
async function cloudInit(){
  if(cl.st!=="in")return;
  try{
    const row=await cloudPull();
    if(!row){await cloudPush();try{localStorage.setItem("orderguard.linked",uidOf())}catch(e){}return}
    const rr=+row.rev||0,lr=S.rev||0;
    let linked=false;try{linked=localStorage.getItem("orderguard.linked")===uidOf()}catch(e){}
    if(rr>lr||!linked){try{await backupInsert(S)}catch(e){}S=migrate(row.data);S.rev=rr;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}cl.last=Date.now();cl.err="";toast(t("cloudRestored"))}
    else if(rr<lr){await cloudPush();try{localStorage.setItem("orderguard.linked",uidOf())}catch(e){}return}
    else{cl.last=Date.now();cl.err=""}
    try{localStorage.setItem("orderguard.linked",uidOf())}catch(e){}
  }catch(e){cl.err=String(e&&e.message||e)}
  render();
}

function buildIcs(){
  const code=["SU","MO","TU","WE","TH","FR","SA"],lead=+S.lead||30,now=new Date();
  const z=n=>String(n).padStart(2,"0"),stamp=now.getUTCFullYear()+z(now.getUTCMonth()+1)+z(now.getUTCDate())+"T"+z(now.getUTCHours())+z(now.getUTCMinutes())+z(now.getUTCSeconds())+"Z";
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Solverian//Order Guard//EN","CALSCALE:GREGORIAN"];
  let n=0;
  S.vendors.forEach(v=>{
    const ds=(v.days||[]).slice().sort();if(!ds.length)return;n++;
    const first=new Date();first.setHours(0,0,0,0);
    for(let k=0;k<7;k++){const c=new Date(first);c.setDate(c.getDate()+k);if(ds.includes(c.getDay())){first.setTime(c.getTime());break}}
    const m=cutMin(v),ds0=first.getFullYear()+z(first.getMonth()+1)+z(first.getDate());
    const st=ds0+"T"+z(Math.floor(m/60))+z(m%60)+"00",en=ds0+"T"+z(Math.floor((m+15)/60)%24)+z((m+15)%60)+"00";

  });
  out.push("END:VCALENDAR");
  return n?out.join("\r\n")+"\r\n":"";
}

function stats(){
  const cut=new Date();cut.setDate(cut.getDate()-30);const c=cut.toISOString().slice(0,10);
  const os=S.orders.filter(o=>o.date>=c),rcv=S.orders.filter(o=>o.received&&o.date>=c),runs=S.runs.filter(r=>r.date>=c);
  const shorts=rcv.reduce((a,o)=>a+o.shorts.length,0),amt=runs.reduce((a,r)=>a+(+r.amount||0),0),miss={};
  rcv.forEach(o=>o.shorts.forEach(s=>{const n=dispName(s.itemId,s.name);miss[n]=(miss[n]||0)+1}));
  runs.forEach(r=>{miss[r.item]=(miss[r.item]||0)+1});
  return{orders:os.length,shorts,runs:runs.length,amt,top:Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}

  else if(a==="vcut"){v.cutoff=el.value||"09:00";persist()}
  else if(a==="lead"){S.lead=+el.value;persist()}
  else if(a==="store"){S.store=el.value;persist()}
  else if(a==="storeEn"){S.storeEn=el.value;persist()}
  else if(a==="vname"){v.name=el.value;persist()}
  else if(a==="vnameEn"){v.en=el.value;persist()}
  else if(a==="vphone"){v.phone=el.value.replace(/[^\d+]/g,"");persist()}
  else if(a==="iname"){itemOf(v,id).name=el.value;persist()}
  else if(a==="ien"){itemOf(v,id).en=el.value;persist()}
  else if(a==="iunit"){itemOf(v,id).unit=el.value;persist()}
});
init();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener("load",()=>{const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had){const u=document.getElementById("upd");if(u)u.style.display="block"}});navigator.serviceWorker.register("sw.js").then(r=>{r.update();setInterval(()=>r.update(),3600000)}).catch(()=>{})})}
</script>
